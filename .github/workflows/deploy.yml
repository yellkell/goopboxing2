# Build the game and deploy it to GitHub Pages (Pages must be set to
# "GitHub Actions" in the repo settings).
#
# The built site is fully static — practice bouts work straight off Pages
# (WebXR needs https, which Pages is). Online bouts additionally need the
# Firebase config in src/net/firebaseConfig.ts (see README → "Standing up
# the Firebase").

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
